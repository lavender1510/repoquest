name: Publish First Quest
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'lavender1510/repoquest'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./release.db
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Initialize SQLite
        run: npm run db:push
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Publish tag and release
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 is already published."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git show-ref --verify --quiet refs/tags/v1.0.0; then
            git tag -a v1.0.0 -m "RepoQuest v1.0.0 — First Quest"
          fi
          git push origin refs/tags/v1.0.0:refs/tags/v1.0.0
          git archive --format=tar.gz --prefix=repoquest/ v1.0.0 -o repoquest-v1.0.0.tar.gz
          gh release create v1.0.0 repoquest-v1.0.0.tar.gz --title "RepoQuest v1.0.0 — First Quest" --notes-file RELEASE_NOTES.md --verify-tag
